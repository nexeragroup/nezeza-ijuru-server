name: Server Staging CI/CD

on:
  pull_request:
    branches: [staging]
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: server-staging
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  NODE_VERSION: 24.15.0
  PNPM_VERSION: 10.17.1
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/nezeza-ijuru-server-staging

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Unit tests
        run: NODE_OPTIONS=--experimental-vm-modules pnpm exec jest --runInBand

      - name: Build
        run: pnpm run build

  image:
    name: Publish staging container image
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=staging

      - name: Build and push staging image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: NODE_ENV=staging
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

  deploy:
    name: Deploy staging
    if: github.event_name != 'pull_request'
    needs: image
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Check out deployment files
        uses: actions/checkout@v4
        with:
          sparse-checkout: docker-compose.staging.yml

      - name: Validate staging deployment secrets
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.STAGING_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STAGING_DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.STAGING_DEPLOY_KNOWN_HOSTS }}
          GHCR_USERNAME: ${{ secrets.STAGING_GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.STAGING_GHCR_TOKEN }}
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS GHCR_USERNAME GHCR_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing staging deployment secret for $name"
              exit 1
            fi
          done

      - name: Load deployment SSH key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}

      - name: Configure SSH host verification
        shell: bash
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.STAGING_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Copy staging Compose definition
        env:
          DEPLOY_HOST: ${{ secrets.STAGING_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STAGING_DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          scp docker-compose.staging.yml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/docker-compose.staging.yml"

      - name: Deploy and verify staging
        env:
          DEPLOY_HOST: ${{ secrets.STAGING_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STAGING_DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
          GHCR_USERNAME: ${{ secrets.STAGING_GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.STAGING_GHCR_TOKEN }}
          IMAGE: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          {
            printf '%s\n' "$GHCR_TOKEN"
            cat <<REMOTE_SCRIPT
          set -euo pipefail
          DEPLOY_PATH='${DEPLOY_PATH}'
          IMAGE='${IMAGE}'
          GHCR_USERNAME='${GHCR_USERNAME}'

          printf '%s' "\$GHCR_TOKEN" | docker login ghcr.io --username "\$GHCR_USERNAME" --password-stdin
          cd "\$DEPLOY_PATH"
          SERVER_IMAGE="\$IMAGE" docker compose --env-file .env.staging -f docker-compose.staging.yml pull api postgres redis
          SERVER_IMAGE="\$IMAGE" docker compose --env-file .env.staging -f docker-compose.staging.yml up -d --no-build --wait
          docker compose --env-file .env.staging -f docker-compose.staging.yml exec -T api node dist/database/bootstrap.js
          docker compose --env-file .env.staging -f docker-compose.staging.yml exec -T api node -e "fetch('http://127.0.0.1:3000/api/v1/health/ready').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))"
          REMOTE_SCRIPT
          } | ssh "$DEPLOY_USER@$DEPLOY_HOST" 'read -r GHCR_TOKEN; export GHCR_TOKEN; bash -s'
